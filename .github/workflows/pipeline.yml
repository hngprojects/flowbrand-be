name: Pipeline

# ══════════════════════════════════════════════════════════════════════════════
#  TRIGGER STRATEGY
#
#  Branch → Environment mapping (branch protection rules enforce no direct push):
#    dev     → deploys to dev     (on every push, fast feedback)
#    staging → deploys to staging (gated by GitHub Environment reviewers)
#    main    → deploys to prod    (gated by GitHub Environment reviewers)
#
#  workflow_dispatch lets you trigger any environment manually from the UI
#  without needing a push — useful for re-deploys and running on ci branch.
#
#  PR → lint + build only, never deploys.
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - dev
      - staging
      - main

  pull_request:
    branches:
      - dev
      - staging
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, staging, prod]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  #  PULL REQUEST GATE — validate only, never deploy
  # ════════════════════════════════════════════════════════════════════════════

  lint-pr:
    name: Lint (PR)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_lint.yml

  build-pr:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    needs: lint-pr
    uses: ./.github/workflows/_build.yml
    with:
      environment: dev

  # ── Uncomment when the team has written tests ──────────────────────────────
  # test-pr:
  #   name: Test (PR)
  #   if: github.event_name == 'pull_request'
  #   needs: lint-pr
  #   uses: ./.github/workflows/_test.yml

  # ════════════════════════════════════════════════════════════════════════════
  #  SHARED GATES — lint + security run before every non-PR deploy
  # ════════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml

  security:
    name: Security
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_security.yml

  # ── Uncomment when the team has written tests ──────────────────────────────
  # test:
  #   name: Test
  #   if: github.event_name != 'pull_request'
  #   uses: ./.github/workflows/_test.yml

  # ════════════════════════════════════════════════════════════════════════════
  #  BUILD — resolves environment from branch or dispatch input
  # ════════════════════════════════════════════════════════════════════════════

  build:
    name: Build
    if: github.event_name != 'pull_request'
    needs: [lint, security]
    # ── Uncomment the line below once tests are active ──────────────────────
    # needs: [lint, security, test]
    uses: ./.github/workflows/_build.yml
    with:
      environment: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          github.ref == 'refs/heads/main'    && 'prod'    ||
          github.ref == 'refs/heads/staging' && 'staging' ||
          'dev'
        }}

  # ════════════════════════════════════════════════════════════════════════════
  #  DEPLOY — one job per environment, each guarded by its own `if:`
  #  GitHub Environment protection rules (required reviewers) are the gate
  #  for staging and prod — no extra code needed, configure in repo Settings.
  # ════════════════════════════════════════════════════════════════════════════

  deploy-dev:
    name: Deploy → dev
    if: |
      github.event_name != 'pull_request' && (
        (github.event_name == 'push'              && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      tarball: ${{ needs.build.outputs.tarball }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

  deploy-staging:
    name: Deploy → staging
    if: |
      github.event_name != 'pull_request' && (
        (github.event_name == 'push'              && github.ref == 'refs/heads/staging') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      tarball: ${{ needs.build.outputs.tarball }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

  deploy-prod:
    name: Deploy → prod
    if: |
      github.event_name != 'pull_request' && (
        (github.event_name == 'push'              && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      tarball: ${{ needs.build.outputs.tarball }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
