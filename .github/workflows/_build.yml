name: _build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment — controls which ecosystem config is bundled (dev | staging | prod)'
        required: true
        type: string
    outputs:
      tarball:
        description: 'Tarball filename produced by this job'
        value: ${{ jobs.build.outputs.tarball }}
      artifact_name:
        description: 'GitHub Actions artifact name that holds the tarball'
        value: ${{ jobs.build.outputs.artifact_name }}

env:
  TARBALL: nestjs-${{ inputs.environment }}.tar.gz
  ECOSYSTEM_CONFIG: ${{ inputs.environment == 'prod' && 'main' || inputs.environment }}-ecosystem-config.json
  ARTIFACT_NAME: build-${{ inputs.environment }}

jobs:
  build:
    name: Build (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.meta.outputs.tarball }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Bundle runtime files into dist
        run: cp package.json deployment.sh ${{ env.ECOSYSTEM_CONFIG }} dist/

      - name: Create tarball
        run: tar -czf ${{ env.TARBALL }} dist/

      - name: Expose metadata to downstream jobs
        id: meta
        run: |
          echo "tarball=${{ env.TARBALL }}"       >> "$GITHUB_OUTPUT"
          echo "artifact_name=${{ env.ARTIFACT_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.TARBALL }}
          # Artifacts are ephemeral — only needed within this pipeline run.
          retention-days: 1
