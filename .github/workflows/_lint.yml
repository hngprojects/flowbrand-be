name: _lint

on:
  workflow_call:
  # Allows this to be run directly from Actions UI on any branch —
  # useful for testing before a branch is merged (e.g. running on ci branch).
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Run lint
        run: npm run lint
